backend:
  name: github
  repo: Vermont-Dodgeball/vermont-dodgeball
  branch: main
  # Sveltia CMS needs a small OAuth proxy to log editors in with their GitHub
  # account (GitHub Pages can't do the OAuth token exchange itself, since
  # that requires a server-side secret). Once the proxy is deployed
  # (see https://github.com/sveltia/sveltia-cms-auth for a free one-command
  # deploy to Cloudflare Workers), uncomment and set this to its URL:
  # base_url: https://your-worker-subdomain.workers.dev

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:
  - name: "about"
    label: "About Page"
    files:
      - name: "about"
        label: "About Content"
        file: "data/about.json"
        format: json
        fields:
          - { label: "Hero Tagline", name: "tagline", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

  - name: "photos"
    label: "Photo Gallery"
    files:
      - name: "photos"
        label: "Photos"
        file: "data/photos.json"
        format: json
        fields:
          - label: "Photos"
            name: "photos"
            widget: "list"
            summary: "{{fields.alt}}"
            fields:
              - { label: "Image", name: "src", widget: "image" }
              - { label: "Alt text", name: "alt", widget: "string", default: "Vermont Dodgeball event photo" }
