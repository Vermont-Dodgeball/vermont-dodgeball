    <script>
        const currentYear = new Date().getFullYear();
        document.getElementById("currentYear").innerHTML = currentYear;
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
    <script>
        fetch('data/about.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Request failed with status ${response.status}`);
                }
                return response.json();
            })
            .then(about => {
                document.getElementById('hero-tagline').textContent = about.tagline;

                // The card stays hidden unless the data file describes a game.
                if (about.nextGame) {
                    document.getElementById('next-game-heading').textContent = about.nextGame.heading;

                    // js/calendar.js fills this in from the real schedule and
                    // marks it; these values are the fallback when it can't.
                    const whenElement = document.getElementById('next-game-when');
                    if (whenElement.dataset.source !== 'calendar') {
                        whenElement.textContent = about.nextGame.when;
                    }

                    setWhere(about.nextGame.where, about.nextGame.whereUrl);
                    document.getElementById('next-game-cost').textContent = about.nextGame.cost;
                    document.getElementById('next-game-note').textContent = about.nextGame.note;
                    document.getElementById('next-game').hidden = false;
                }

                const aboutBody = document.getElementById('about-body');

                // Fall back to plain paragraphs if the Markdown library is unreachable.
                if (window.marked) {
                    aboutBody.innerHTML = marked.parse(about.body);
                } else {
                    about.body.split('\n\n').forEach(paragraph => {
                        const p = document.createElement('p');
                        p.textContent = paragraph;
                        aboutBody.appendChild(p);
                    });
                }
            })
            .catch(error => console.error('Could not load about content:', error));


        // Renders the location as a map link when the data file supplies a URL,
        // and as plain text when it does not.
        function setWhere(where, whereUrl) {
            const target = document.getElementById('next-game-where');
            const isWebLink = typeof whereUrl === 'string' && /^https?:\/\//.test(whereUrl);

            if (!isWebLink) {
                target.textContent = where;
                return;
            }

            const link = document.createElement('a');
            link.href = whereUrl;
            link.textContent = where;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            target.replaceChildren(link);
        }
    </script>
